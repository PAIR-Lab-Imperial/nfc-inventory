<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find and view PAIR Lab equipment availability">
    <meta name="theme-color" content="#123b5d">
    <title>PAIR Lab Equipment</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <script src="./theme.js?v=0.14.0"></script>
    <link rel="stylesheet" href="./styles.css?v=0.14.0">
    <script src="./config.js"></script>
    <script type="module" src="./app.js?v=0.14.0"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="PAIR Lab equipment catalogue">
          <span class="brand-mark" aria-hidden="true">PAIR</span>
          <span class="brand-copy">
            <strong>Lab Equipment</strong>
            <small>NFC equipment inventory</small>
          </span>
        </a>
        <div class="header-actions">
          <span class="live-badge"><span aria-hidden="true"></span> Live inventory</span>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use dark mode" title="Use dark mode">
            <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"/></svg>
            <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Loading equipment</h1>
        <p>Connecting to the PAIR Lab inventory…</p>
      </section>
    </main>

    <noscript>
      <p class="noscript">This catalogue requires JavaScript to load current equipment information.</p>
    </noscript>

    <footer>
      <div class="footer-inner">
        <span>PAIR Lab</span>
        <span><a href="./admin.html">Administrator</a> · Availability is informational and may change.</span>
      </div>
    </footer>
  </body>
</html>
