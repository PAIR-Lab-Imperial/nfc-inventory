<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find and view PAIR Lab equipment availability">
    <meta name="theme-color" content="#123b5d">
    <title>PAIR Lab Equipment</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="PAIR Lab equipment catalogue">
          <span class="brand-mark" aria-hidden="true">PAIR</span>
          <span class="brand-copy">
            <strong>Lab Equipment</strong>
            <small>NFC equipment inventory</small>
          </span>
        </a>
        <span class="live-badge"><span aria-hidden="true"></span> Live inventory</span>
      </div>
    </header>

    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Loading equipment</h1>
        <p>Connecting to the PAIR Lab inventory…</p>
      </section>
    </main>

    <noscript>
      <p class="noscript">This catalogue requires JavaScript to load current equipment information.</p>
    </noscript>

    <footer>
      <div class="footer-inner">
        <span>PAIR Lab</span>
        <span><a href="./admin.html">Administrator</a> · Availability is informational and may change.</span>
      </div>
    </footer>
  </body>
</html>
