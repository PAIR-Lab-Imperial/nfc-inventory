<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PAIR Lab inventory administration">
    <meta name="theme-color" content="#123b5d">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://pair-lab-nfc-inventory-api.pair-lab-nfc-inventory.workers.dev; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'">
    <title>Administrator · PAIR Lab Equipment</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./admin.css">
    <script src="./config.js"></script>
    <script type="module" src="./admin.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="PAIR Lab equipment catalogue">
          <span class="brand-mark" aria-hidden="true">PAIR</span>
          <span class="brand-copy">
            <strong>Inventory administration</strong>
            <small>Secure inventory access</small>
          </span>
        </a>
        <span class="admin-badge">Restricted access</span>
      </div>
    </header>

    <main id="admin-app" class="app-shell admin-shell" aria-live="polite">
      <section class="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Loading administration</h1>
        <p>Checking the administrator session…</p>
      </section>
    </main>

    <noscript>
      <p class="noscript">The administrator dashboard requires JavaScript.</p>
    </noscript>

    <footer>
      <div class="footer-inner">
        <a href="./">← Public equipment catalogue</a>
        <span>PAIR Lab</span>
      </div>
    </footer>
  </body>
</html>
